<title>Esquemas GS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com abas; conteúdo em coluna única de até 980px; cada grupo tem cor própria (elétrica = âmbar, hidráulica = azul). */
:root{
  --bg:#e9edef; --surface:#ffffff; --surface2:#f3f6f7; --fg:#192227; --muted:#566570; --line:#cfd8dd;
  --steel:#33505f; --steel-fg:#ffffff; --steel-bg:#dde8ee;
  --elec:#a45f00; --elec-fg:#ffffff; --elec-bg:#fdecc8;
  --hyd:#0a6a97; --hyd-fg:#ffffff; --hyd-bg:#d6edf8;
  --ok:#17703f; --ok-bg:#d9f1e3; --bad:#b3261e; --bad-bg:#fbe0dd;
  --imgbg:#ffffff; --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
  --ac:var(--steel); --ac-fg:var(--steel-fg); --ac-bg:var(--steel-bg);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171b; --surface:#1b2227; --surface2:#222b31; --fg:#e7edf0; --muted:#9aa9b3; --line:#334048;
  --steel:#8fb5ca; --steel-fg:#0f1a20; --steel-bg:#1f3039;
  --elec:#f2b134; --elec-fg:#201500; --elec-bg:#3b2d10;
  --hyd:#5fc1ee; --hyd-fg:#06202c; --hyd-bg:#0f2f3e;
  --ok:#62d391; --ok-bg:#14301f; --bad:#ff8f86; --bad-bg:#3b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --surface:#1b2227; --surface2:#222b31; --fg:#e7edf0; --muted:#9aa9b3; --line:#334048;
  --steel:#8fb5ca; --steel-fg:#0f1a20; --steel-bg:#1f3039;
  --elec:#f2b134; --elec-fg:#201500; --elec-bg:#3b2d10;
  --hyd:#5fc1ee; --hyd-fg:#06202c; --hyd-bg:#0f2f3e;
  --ok:#62d391; --ok-bg:#14301f; --bad:#ff8f86; --bad-bg:#3b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
*{box-sizing:border-box}
[data-g="e"]{--ac:var(--elec);--ac-fg:var(--elec-fg);--ac-bg:var(--elec-bg)}
[data-g="h"]{--ac:var(--hyd);--ac-fg:var(--hyd-fg);--ac-bg:var(--hyd-bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;padding-block:10px 4px}
.brand b{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--muted);font-size:.8rem;flex:1 1 200px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);min-height:40px}
nav.tabs button[aria-current="page"]{background:var(--ac-bg);color:var(--ac)}
main{padding-block:20px 60px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.muted{color:var(--muted)} .small{font-size:.86rem}
.mono{font-family:var(--f-mono);font-size:.9em}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--ac)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--ac-fg)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac-bg);color:var(--ac);font-size:.78rem;font-weight:600}
.bar{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.symimg{background:var(--imgbg);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:10px}
.symimg img{max-width:100%;height:auto;display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .symimg{width:64px;height:48px;padding:4px}
.thumbs img{max-height:100%;width:auto;max-width:100%;object-fit:contain}
.lesson{display:grid;gap:10px}
.lesson .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.kicker{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ac)}
.study{display:grid;gap:14px}
.study .stage{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.study .stage{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.study .symimg{min-height:220px;padding:20px}
.study .symimg img{max-height:300px;min-width:90px}
.facts{display:grid;gap:10px}
.facts .tip{background:var(--ac-bg);border-radius:8px;padding:10px 12px;font-size:.95rem}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ac)}
.q h2{margin-bottom:10px}
.q .media{margin-block:10px}
.q canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.q svg{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;min-height:52px;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--ac)}
.opt.sel{border-color:var(--ac);background:var(--ac-bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--ac);flex:0 0 auto}
.opts.imgs .opt{justify-content:center;padding:8px}
.opts.imgs .opt img{background:#fff;border-radius:6px;max-height:120px;max-width:100%;padding:6px}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
input.txt{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);min-height:48px}
.res-score{font-family:var(--f-display);font-size:4rem;line-height:1}
.rev{display:grid;gap:8px}
.rev .it{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px;border-radius:8px;background:var(--surface2)}
.rev .it.ok .mk{color:var(--ok)} .rev .it.bad .mk{color:var(--bad)}
.rev .mk{font-weight:700;font-size:1.1rem}
.viewer{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:10px;height:min(68vh,620px);touch-action:none;cursor:grab}
.viewer:active{cursor:grabbing}
.viewer .hs{position:absolute;border:calc(2px*var(--inv,1)) solid transparent;border-radius:calc(4px*var(--inv,1))}
.viewer.show .hs{border-color:color-mix(in srgb,var(--ac) 80%,transparent);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.viewer .hs.sel{border-color:#d4290f!important;background:rgba(212,41,15,.14)!important}
.viewer .hs.good{border-color:#17803f!important;background:rgba(23,128,63,.22)!important}
.viewer .hs.wrong{border-color:#d4290f!important;background:rgba(212,41,15,.3)!important}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .btn{padding:8px 14px;min-height:42px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--ac-bg);border-color:var(--ac);color:var(--ac)}
.glos{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.glos button{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;position:relative}
.glos button:hover{border-color:var(--ac)}
.glos .symimg{height:84px;padding:6px}
.glos .symimg img{max-height:100%;max-width:100%;width:auto}
.glos .nm{font-size:.82rem;line-height:1.25;font-weight:500}
.dom{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.dom.m2{background:var(--ok)} .dom.m1{background:var(--ac)}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px}
.modal .card{max-width:760px;width:100%;margin-top:6vh}
table.cores{border-collapse:collapse;width:100%;font-size:.92rem}
table.cores td,table.cores th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}
ul.clean{margin:0;padding-left:1.1rem;display:grid;gap:6px}
.locked{opacity:.75}
.hist{display:grid;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--surface2);border-radius:6px;font-size:.9rem}
.big-n{font-family:var(--f-display);font-size:2.4rem;line-height:1}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
</style>

/* ---------- ELÉTRICA ---------- */
{id:'e_fio',g:'e',lesson:'e1',name:'Fio com descrição ou cor',file:'e_fio',
 what:'Linha que representa um fio. Ao lado vem escrito o que o sinal faz (ex.: MOTOR CONTR. ENABLE) e a cor do fio (ex.: RD).',
 tip:'Leia sempre a sigla da cor e o texto da função: eles dizem qual fio procurar na máquina.',kw:['fio']},
{id:'e_cruzamento',g:'e',lesson:'e1',name:'Cruzamento de circuitos sem conexão',file:'e_cruzamento',
 what:'Duas linhas se cruzam, mas não se tocam eletricamente. Cada fio segue o seu caminho.',
 tip:'Sem ponto no cruzamento = sem ligação.',kw:['cruzamento']},
{id:'e_conexao',g:'e',lesson:'e1',name:'Conexões do circuito',file:'e_conexao',
 what:'Ponto preto onde as linhas se encontram: os fios estão ligados entre si (emenda).',
 tip:'Ponto = ligado. Sem ponto = não ligado.',kw:['conexao','conexoes','juncao','emenda','ponto'],no:['cruzamento','sem']},
{id:'e_conector',g:'e',lesson:'e1',name:'Conector Deutsch',file:'e_conector-deutsch',
 what:'Conector de plugue com pinos numerados, desenhado como uma caixa tracejada com um código (ex.: J15). As setas mostram o encaixe entre as duas metades.',
 tip:'Procure o número do pino: ele diz qual terminal do plugue o fio ocupa.',kw:['deutsch','conector']},
{id:'e_bateria',g:'e',lesson:'e2',name:'Bateria de 6 ou 12 V CC',file:'e_bateria',
 what:'Conjunto de células com polos + e −. Alimenta toda a parte elétrica. No GS-1530 aparece como B5 (4–6 V).',
 tip:'Caixa tracejada com placas altas e baixas alternadas e os sinais + e −.',kw:['bateria']},
{id:'e_carregador',g:'e',lesson:'e2',name:'Carregador de bateria',file:'e_carregador',
 what:'Caixa com um plugue de tomada embaixo e um raio dentro; sinais + e − no topo. No GS-1530 é o U9.',
 tip:'Plugue na parte de baixo = entrada de energia da tomada.',kw:['carregador']},
{id:'e_fusivel',g:'e',lesson:'e2',name:'Fusível',file:'e_fusivel',
 what:'Retângulo com uma linha ondulada (o elemento que derrete). Queima se passar corrente demais e precisa ser trocado. No GS-1530: F6 (275 A).',
 tip:'Retângulo com onda = fusível. Arco aberto = disjuntor.',kw:['fusivel']},
{id:'e_disjuntor',g:'e',lesson:'e2',name:'Disjuntor',file:'e_disjuntor',
 what:'Arco entre dois terminais. Protege contra excesso de corrente como o fusível, mas desarma e pode ser rearmado. No GS-1530: CB2 (7 A).',
 tip:'Arco com dois pontos = disjuntor.',kw:['disjuntor']},
{id:'e_diodo',g:'e',lesson:'e2',name:'Diodo',file:'e_diodo',
 what:'Triângulo com uma barra: a corrente passa em um sentido só. No GS-1530: D1 e D2.',
 tip:'A barra marca o lado para onde a corrente vai; no outro sentido ele bloqueia.',kw:['diodo']},
{id:'e_chave_comando',g:'e',lesson:'e3',name:'Chave de comando',file:'e_chave-comando',
 what:'Seletora com posições (PCON, OFF, GCON). A seta marca a posição escolhida e qual contato está ligado. PCON = comando da plataforma, GCON = comando de solo. No GS-1530: KS1.',
 tip:'Caixa com o número 1, 2, 3 nos contatos e uma seta no meio.',kw:['comando']},
{id:'e_botao_emerg',g:'e',lesson:'e3',name:'Botão de parada de emergência',file:'e_botao-emergencia',
 what:'Cogumelo sobre dois contatos: quando apertado, abre o circuito e para a máquina. No GS-1530: P1.',
 tip:'O cogumelo em cima da linha é inconfundível.',kw:['emergencia','parada']},
{id:'e_chave_lim',g:'e',lesson:'e3',name:'Chave limitadora',file:'e_chave-limitadora',
 what:'Chave acionada por um batente (fim de curso). O desenho mostra os dois tipos: N.O. (normalmente aberta) e N.C.H.O. (normalmente fechada, mantida aberta). No GS-1530: LS6, LS7 e LS8.',
 tip:'Contato com uma lâmina e um círculo (o roletes/atuador) ao lado.',kw:['limitadora','fim de curso']},
{id:'e_contator',g:'e',lesson:'e3',name:'Contator',file:'e_contator',
 what:'Relé de potência: uma bobina (retângulo com traço) que, ao receber corrente, fecha contatos grossos que ligam o motor. No GS-1530: K1.',
 tip:'Bobina em cima, contatos pesados (linha grossa) embaixo.',kw:['contator']},
{id:'e_controlador',g:'e',lesson:'e3',name:'Controlador do motor',file:'e_controlador-motor',
 what:'Caixa com terminais (B+, B−, A2, T2, 1, 3…). Recebe a bateria e o comando e entrega potência ao motor. No GS-1530: U6.',
 tip:'Caixa com cantos arredondados e terminais com nome.',kw:['controlador']},
{id:'e_motor',g:'e',lesson:'e3',name:'Motor',file:'e_motor',
 what:'Círculo com M e o número do motor, com terminais de ligação (ex.: D1 e A1). No GS-1530: M5.',
 tip:'Círculo com a letra M.',kw:['motor']},
{id:'e_solenoide',g:'e',lesson:'e4',name:'Válvula solenoide com diodo',file:'e_solenoide-diodo',
 what:'Quadro com a bobina, um diodo em paralelo e o desenho da válvula. O diodo absorve o pico de tensão quando a bobina desliga. No GS-1530: Y3 a Y8.',
 tip:'Bobina + diodo + válvula (duas pontas de triângulo) dentro do mesmo quadro.',kw:['solenoide','valvula']},
{id:'e_resistor',g:'e',lesson:'e4',name:'Resistor',file:'e_resistor',
 what:'Retângulo com o valor em ohms (Ω). No GS-1530: R30 = 200 Ω.',
 tip:'O valor escrito dentro do retângulo entrega o símbolo.',kw:['resistor','resistencia']},
{id:'e_buzina',g:'e',lesson:'e4',name:'Buzina ou alarme',file:'e_buzina',
 what:'Desenho de um alto-falante. Emite o som de alerta. No GS-1530: H5 (alarme) e H2 (buzina opcional).',
 tip:'Quadrado com cone: alto-falante.',kw:['buzina','alarme']},
{id:'e_pisca',g:'e',lesson:'e4',name:'Sinalizador pisca-pisca',file:'e_pisca',
 what:'Círculo com raios: luz de aviso que pisca. No GS-1530: FB (opcional).',
 tip:'Círculo com 4 raios nos cantos.',kw:['pisca','sinalizador']},
{id:'e_sens_nivel',g:'e',lesson:'e4',name:'Sensor de nível',file:'e_sensor-nivel',
 what:'Retângulo com V+, SIG e V−, e um círculo na saída. V+ e V− alimentam o sensor; SIG é o sinal. No GS-1530: S7 (LEVEL SENSOR).',
 tip:'Parece o transdutor de pressão. Olhe o código ao lado (LEVEL SENSOR, PRESSURE TRANSDUCER).',kw:['nivel']},
{id:'e_sens_altura',g:'e',lesson:'e4',name:'Sensor de altura da plataforma',file:'e_sensor-altura',
 what:'Retângulo com V+, SIG e V−, com um círculo e um ângulo dentro (sensor rotativo). Informa a altura da plataforma.',
 tip:'O círculo com o ângulo dentro é o que o diferencia dos outros dois sensores.',kw:['altura']},
{id:'e_transdutor',g:'e',lesson:'e4',name:'Transdutor de pressão',file:'e_transdutor-pressao',
 what:'Retângulo com V+, SIG e V−, e um círculo com uma linha na entrada. Converte pressão em sinal elétrico.',
 tip:'Mesmo formato do sensor de nível; o texto ao lado identifica.',kw:['transdutor']},
/* ---------- HIDRÁULICA ---------- */
{id:'h_bomba',g:'h',lesson:'h1',name:'Bomba de deslocamento fixo',file:'h_bomba',
 what:'Círculo com um triângulo preto apontando para fora: empurra o óleo para o sistema. Cada volta move sempre a mesma quantidade de óleo (GS-1330m: 1.5 cc/r).',
 tip:'Triângulo para FORA do círculo = bomba. Para DENTRO = motor.',kw:['bomba']},
{id:'h_motor_var',g:'h',lesson:'h1',name:'Motor de velocidade variável',file:'h_motor-variavel',
 what:'Círculo com M e uma seta diagonal. Nos esquemas desta máquina é o motor elétrico que gira a bomba (power unit).',
 tip:'M dentro do círculo, seta cortando por cima.',kw:['velocidade','variavel']},
{id:'h_motor_bi',g:'h',lesson:'h1',name:'Motor bidirecional',file:'h_motor-bidirecional',
 what:'Círculo com dois triângulos pretos apontando para dentro: o óleo faz o motor girar nos dois sentidos. No GS-1530: motores de acionamento esquerdo e direito.',
 tip:'Dois triângulos para dentro = motor hidráulico que gira para os dois lados.',kw:['bidirecional']},
{id:'h_filtro',g:'h',lesson:'h1',name:'Filtro',file:'h_filtro',
 what:'Losango com uma linha tracejada no meio. Retém a sujeira do óleo. Nos esquemas aparece com uma válvula de bypass em paralelo (10 micron, 25 psi).',
 tip:'Losango cortado por traço tracejado.',kw:['filtro']},
{id:'h_acumulador',g:'h',lesson:'h1',name:'Acumulador',file:'h_acumulador',
 what:'Cilindro arredondado com uma mola desenhada dentro: guarda óleo sob pressão. No GS-1530 é o item P (4.75 pol³ / 78 cc).',
 tip:'Formato de cápsula com zigue-zague (mola) dentro.',kw:['acumulador']},
{id:'h_cilindro',g:'h',lesson:'h2',name:'Cilindro hidráulico',file:'h_cilindro',
 what:'Retângulo com um êmbolo e uma haste. O óleo empurra o êmbolo e a haste entra ou sai. Aparece na elevação e na direção.',
 tip:'Retângulo dividido com uma haste saindo por um lado.',kw:['cilindro']},
{id:'h_freio',g:'h',lesson:'h2',name:'Freio',file:'h_freio',
 what:'Símbolo do freio. No GS-1530 o freio é liberado com pressão de óleo (BRAKE RELEASE PRESSURE) e pode ser liberado à mão com a bomba manual.',
 tip:'Caixa aberta em cima de uma linha vertical.',kw:['freio']},
{id:'h_transdutor',g:'h',lesson:'h2',name:'Transdutor de pressão',file:'h_transdutor',
 what:'Mede a pressão do óleo e manda um sinal elétrico (raio de entrada). No GS-1530 é o item R (sobrecarga da plataforma).',
 tip:'Seta de pressão entrando por baixo e um raio indicando o sinal elétrico.',kw:['transdutor']},
{id:'h_orificio',g:'h',lesson:'h2',name:'Orifício calibrado',file:'h_orificio',
 what:'Estrangulamento de tamanho exato, com a medida escrita ao lado (ex.: 0.037 inch / 0.94 mm). Limita a vazão.',
 tip:'Dois arcos que se aproximam, com a medida em cima.',kw:['orificio']},
{id:'h_seguranca',g:'h',lesson:'h3',name:'Válvula de segurança',file:'h_seguranca',
 what:'O manual chama de válvula de segurança; na oficina também se diz válvula de alívio. Abre quando a pressão passa do valor ajustado e manda o óleo para o tanque. A linha tracejada é o piloto.',
 tip:'Quadro com seta e mola em cima; a seta diagonal sobre a mola indica ajustável.',kw:['seguranca','alivio']},
{id:'h_retencao',g:'h',lesson:'h3',name:'Válvula de retenção',file:'h_retencao',
 what:'Bolinha contra um assento (com ou sem mola): o óleo passa em um sentido e bloqueia o outro.',
 tip:'Círculo encostado em um "V" na linha.',kw:['retencao']},
{id:'h_corredica',g:'h',lesson:'h3',name:'Válvula corrediça',file:'h_corredica',
 what:'Hexágono com uma bolinha no meio e duas entradas laterais: passa o lado de maior pressão e fecha o outro. Em outros livros costuma ser chamada de válvula seletora (shuttle).',
 tip:'Hexágono atravessado por uma linha, bolinha no centro.',kw:['corredica','seletora','shuttle']},
{id:'h_regulador',g:'h',lesson:'h3',name:'Regulador de vazão prioritária',file:'h_regulador-vazao',
 what:'Quadro com orifício e seta: mantém uma vazão fixa (ex.: 0.75 gpm / 2.8 L/min) para a função prioritária. No GS-1530 faz parte do conjunto G.',
 tip:'Quadro alto com seta no topo e símbolo de orifício dentro.',kw:['regulador','vazao']},
{id:'h_2p2v_nf',g:'h',lesson:'h4',name:'Válvula operada por solenoide de 2 posições e 2 vias normalmente fechada',file:'h_sol-2p2v-nf',pv:[2,2],
 what:'Duas caixas (posições): de um lado a bobina, do outro uma mola e o desenho do fluxo. Sem energia a válvula fica na posição "normalmente fechada".',
 tip:'Duas caixas lado a lado, com uma seta vertical e uma bolinha de retenção.',kw:null},
{id:'h_dir_2p2v_nf',g:'h',lesson:'h4',name:'Válvula direcional operada por solenoide de 2 posições e 2 vias normalmente fechada',file:'h_dir-2p2v-nf',pv:[2,2],
 what:'Mola e retenção à esquerda, seta no meio, bobina (Y7) à direita. Aparece no comando de descida da plataforma.',

{id:'h_bloqueio',g:'h',lesson:'h4',name:'Válvula de bloqueio operada por solenoide de 2 posições e 2 vias normalmente aberta',file:'h_bloqueio-2p2v-na',pv:[2,2],

{id:'h_dosador',g:'h',lesson:'h4',name:'Solenoide dosador operado por válvula direcional de 2 posições e 2 vias normalmente fechada',file:'h_dosador',pv:[2,2],
 what:'Igual às de 2 vias, mas a seta diagonal sobre a bobina (Y7) indica controle variável (proporcional): a abertura muda conforme o sinal.',

/* ===================== Geração de perguntas ===================== */
function distractSyms(s,n=3){
  const pool=SYM.filter(x=>x.g===s.g&&x.id!==s.id);
  const same=shuffle(pool.filter(x=>x.lesson===s.lesson)), rest=shuffle(pool.filter(x=>x.lesson!==s.lesson));
  return same.slice(0,1).concat(rest).concat(same.slice(1)).slice(0,n);
}
function qImg2Name(s){const d=distractSyms(s);const opts=shuffle([s,...d]);
  return {type:'img2name',sym:s.id,g:s.g,prompt:'Qual é o nome deste símbolo?',media:{img:s.img},opts:opts.map(o=>o.name),ans:opts.indexOf(s),exp:`${s.name}. ${s.what}`}}
function qName2Img(s){const d=distractSyms(s);const opts=shuffle([s,...d]);
  return {type:'name2img',sym:s.id,g:s.g,prompt:`Qual destes é: <b>${esc(s.name)}</b>?`,optImgs:opts.map(o=>o.img),opts:opts.map(o=>o.name),ans:opts.indexOf(s),exp:`${s.name}. ${s.tip}`}}
function qTyped(s){return {type:'typed',sym:s.id,g:s.g,prompt:'Escreva o nome deste símbolo (pode ser só a palavra principal).',media:{img:s.img},kw:s.kw,no:s.no||[],exp:`Resposta: ${s.name}. ${s.what}`}}
function qPV(s){const askPos=Math.random()<.6;const ans=askPos?s.pv[0]:s.pv[1];
  const pool=askPos?[2,3,4]:[2,4,5];
  return {type:'pv',sym:null,g:s.g,prompt:askPos?'Quantas <b>posições</b> tem esta válvula?':'Quantas <b>vias</b> tem esta válvula?',media:{img:s.img},opts:pool.map(n=>`${n} ${askPos?'posições':'vias'}`),ans:pool.indexOf(ans),exp:`${s.name}: ${s.pv[0]} posições e ${s.pv[1]} vias. ${s.tip}`}}
function qTxt(t,g){const correct=t.o[0];const opts=shuffle(t.o);return {type:'txt',sym:null,g,prompt:esc(t.q),opts,ans:opts.indexOf(correct),exp:t.x}}
function qDiag(d,m){const s=bySym[m.sym];const dis=distractSyms(s);const opts=shuffle([s,...dis]);
  return {type:'diag',sym:s.id,g:s.g,prompt:'Qual símbolo da legenda está dentro da caixa vermelha neste esquema do manual?',media:{diag:d.id,m},opts:opts.map(o=>o.name),ans:opts.indexOf(s),exp:`${s.name}. No desenho: ${m.n}. ${s.what}`}}
function qLetter(d,m){const letter=m.k;const txt=LET[letter];
  const others=shuffle(Object.entries(LET).filter(([k,v])=>v!==txt).map(([k,v])=>v)).slice(0,3);const opts=shuffle([txt,...others]);
  return {type:'letter',sym:null,g:'h',prompt:`Pela tabela da página 209 do manual, o que é o item <b class="mono">${letter}</b> destacado?`,media:{diag:d.id,m},opts,ans:opts.indexOf(txt),exp:`Item ${letter}: ${txt}. ${m.d}`}}
/* conexões */
function svgCross(dot,labelsSwap){
  const w=360,h=200;
  const body=dot?`<circle cx="180" cy="100" r="6" fill="#111"/>`:'';
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Dois fios que se cruzam ${dot?'com':'sem'} ponto"><g stroke="#111" stroke-width="3" fill="none"><path d="M20 100H340"/><path d="M180 20V180"/></g>${body}<g font-family="monospace" font-size="16" fill="#111"><text x="22" y="90">A</text><text x="322" y="90">B</text><text x="190" y="36">C</text><text x="190" y="176">D</text></g></svg>`}
function svgTee(){const w=360,h=200;return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Fio vertical encontrando fio horizontal com ponto"><g stroke="#111" stroke-width="3" fill="none"><path d="M20 90H340"/><path d="M180 90V180"/></g><circle cx="180" cy="90" r="6" fill="#111"/><g font-family="monospace" font-size="16" fill="#111"><text x="22" y="80">A</text><text x="322" y="80">B</text><text x="190" y="172">C</text></g></svg>`}
function svgTrace(perm,from){
  const ys=[40,100,160],w=420,h=200,x0=70,x1=350;
  const lines=perm.map((to,i)=>`<path d="M20 ${ys[i]}H${x0}L${x1} ${ys[to]}H400" />`).join('');
  const L=['A','B','C'];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="Três fios que se cruzam sem ponto"><g stroke="#111" stroke-width="3" fill="none">${lines}</g><g font-family="monospace" font-size="18" fill="#111">${ys.map((y,i)=>`<text x="2" y="${y-8}">${L[i]}</text><text x="405" y="${y-8}">${i+1}</text>`).join('')}</g></svg>`}
function qConn(kind){
  if(kind==='cross'){const dot=Math.random()<.5;return {type:'conn',g:'e',sym:null,prompt:'Os fios <b>A–B</b> (horizontal) e <b>C–D</b> (vertical) estão ligados entre si?',media:{svg:svgCross(dot)},opts:['Sim, estão ligados','Não, só se cruzam'],ans:dot?0:1,exp:dot?'Há um ponto preto no encontro: é uma conexão (emenda).':'Não há ponto: é um cruzamento sem conexão.'}}
  if(kind==='tee'){return {type:'conn',g:'e',sym:null,prompt:'O fio <b>C</b> está ligado ao fio <b>A–B</b>?',media:{svg:svgTee()},opts:['Sim, o ponto marca a ligação','Não, só encosta'],ans:0,exp:'O ponto preto indica emenda: C, A e B ficam no mesmo circuito.'}}
  const perms=[[1,0,2],[0,2,1],[2,1,0],[1,2,0],[2,0,1]].filter(p=>!(p[0]===2&&p[1]===1));
  const perm=perms[Math.random()*perms.length|0];const from=Math.random()*3|0;const to=perm[from];
  return {type:'conn',g:'e',sym:null,prompt:`Siga o fio <b>${'ABC'[from]}</b> da esquerda. Em qual terminal da direita ele chega? (os cruzamentos não têm ponto)`,media:{svg:svgTrace(perm,from)},opts:['Terminal 1','Terminal 2','Terminal 3'],ans:to,exp:`O fio ${'ABC'[from]} chega no terminal ${to+1}. Linhas que só se cruzam não se ligam; siga a linha sem trocar de fio.`}
}
function pickWeak(list,n){return list.map(x=>[x,boxOf(x.id)+Math.random()*1.6]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function diagPool(g){const out=[];DIAGS.filter(d=>d.kind===g).forEach(d=>d.m.forEach(m=>{if(m.sym&&!(g==='h'&&['O','G'].includes(m.k)&&d.id==='h1530'))out.push([d,m])}));return out}
function buildLesson(lid){
  const syms=lessonSyms(lid);const qs=[];
  syms.forEach(s=>{qs.push(qImg2Name(s));qs.push(qName2Img(s))});
  return shuffle(qs);
}
function buildPractice(g,n){
  const syms=pickWeak(symsOf(g),n);const qs=[];
  syms.forEach((s,i)=>{const r=i%4;
    if(r===0)qs.push(qImg2Name(s));else if(r===1)qs.push(qName2Img(s));else if(r===2&&s.kw)qs.push(qTyped(s));else qs.push(qImg2Name(s))});
  return shuffle(qs).slice(0,n);
}
function buildReading(g,n){
  const qs=[];
  if(g==='e'){qs.push(qConn('cross'),qConn('cross'),qConn('tee'),qConn('trace'),qConn('trace'));
    shuffle(TXT.e).slice(0,5).forEach(t=>qs.push(qTxt(t,g)))}
  else{const L=shuffle(DIAGS.find(d=>d.id==='h1530').m.filter(m=>LET[m.k]));L.slice(0,4).forEach(m=>qs.push(qLetter(diagById.h1530,m)));
    shuffle(TXT.h).slice(0,6).forEach(t=>qs.push(qTxt(t,g)))}
  return shuffle(qs).slice(0,n);
}
function buildExam(g){
  if(g==='all'){const a=buildExam('e'),b=buildExam('h');return shuffle(a.slice(0,10).concat(b.slice(0,10)))}
  const syms=symsOf(g),qs=[];
  const pk=pickWeak(syms,12);
  pk.slice(0,6).forEach(s=>qs.push(qImg2Name(s)));
  pickWeak(syms.filter(s=>!pk.slice(0,6).includes(s)),3).forEach(s=>qs.push(qName2Img(s)));
  pickWeak(syms.filter(s=>s.kw),3).forEach(s=>qs.push(qTyped(s)));
  const dp=shuffle(diagPool(g));const seen=new Set();let c=0;
  for(const [d,m] of dp){if(c>=3)break;if(seen.has(m.sym))continue;seen.add(m.sym);qs.push(qDiag(d,m));c++}
  if(g==='e'){qs.push(qConn('cross'),qConn('tee'),qConn('trace'));shuffle(TXT.e).slice(0,2).forEach(t=>qs.push(qTxt(t,g)))}
  else{pickWeak(syms.filter(s=>s.pv),2).forEach(s=>qs.push(qPV(s)));
    shuffle(DIAGS.find(d=>d.id==='h1530').m.filter(m=>LET[m.k])).slice(0,2).forEach(m=>qs.push(qLetter(diagById.h1530,m)));
    qs.push(qTxt(shuffle(TXT.h)[0],g))}
  return shuffle(qs).slice(0,20);
}

let Q=null;
function startQuiz(cfg){cfg.back=cfg.back||{name:'home'};Q=Object.assign({i:0,res:[],pick:null,done:false,typed:''},cfg);go('quiz',{g:cfg.g==='all'?'':cfg.g,live:true})}
function vQuiz(){

  }else{
    body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt ${cls(i,q)}" data-act="pick" data-i="${i}"><span class="l">${labels[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;

  }
  let fb='';
  if(locked&&!exam){fb=`<div class="fb ${Q.lastOk?'ok':'bad'}"><b>${Q.lastOk?'Certo.':'Não foi essa.'}</b> ${q.exp}</div>`}

  app.innerHTML=`<section class="card q" data-g="${q.g}">
    <div class="row" style="justify-content:space-between"><div><div class="kicker">${esc(Q.title)}</div><span class="muted small">Pergunta ${Q.i+1} de ${Q.qs.length}</span></div><button class="btn ghost" data-act="quitq">Sair</button></div>
    ${barHtml(Math.round(100*Q.i/Q.qs.length))}
    <h2 style="margin-top:12px;font-family:var(--f-body);font-weight:600;font-size:1.15rem;line-height:1.35">${q.prompt}</h2>
    <div class="media">${media}</div>
    ${body}${fb}
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      ${q.type==='typed'&&!locked&&!exam?`<button class="btn primary" data-act="check">Conferir</button>`:''}
      ${(locked||exam)?`<button class="btn primary" data-act="next" ${ready?'':'disabled'}>${isLast?'Ver resultado':'Próxima'}</button>`:''}
    </div></section>`;
  if(q.media&&q.media.diag) drawCrop($('#qc'),q.media.diag,q.media.m);
  const inp=$('#ans'); if(inp&&!locked){inp.focus();inp.addEventListener('input',()=>Q.typed=inp.value);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();exam?ACTS.next():ACTS.check()}})}
}
function cls(i,q){
  if(Q.mode==='exam') return Q.pick===i?'sel':'';
  if(!Q.done) return '';
  if(i===q.ans) return 'ok'; if(i===Q.pick) return 'bad'; return '';
}
function norm(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function gradeTyped(q,txt){const t=norm(txt);if(!t)return false;if((q.no||[]).some(w=>t.includes(norm(w))))return false;return q.kw.some(k=>t.includes(norm(k)))}
ACTS.pick=(b)=>{const q=Q.qs[Q.i];if(Q.done&&Q.mode!=='exam')return;const i=+b.dataset.i;Q.pick=i;
  if(Q.mode==='exam'){vQuiz();return}
  Q.done=true;Q.lastOk=i===q.ans;if(q.sym)mark(q.sym,Q.lastOk);Q.res.push({q,ok:Q.lastOk,given:q.opts[i]});vQuiz()};
ACTS.check=()=>{const q=Q.qs[Q.i];if(Q.done)return;const ok=gradeTyped(q,Q.typed);Q.done=true;Q.lastOk=ok;if(q.sym)mark(q.sym,ok);Q.res.push({q,ok,given:Q.typed||'(em branco)'});vQuiz()};
ACTS.next=()=>{
  const q=Q.qs[Q.i];
  if(Q.mode==='exam'){
    let ok,given;
    if(q.type==='typed'){ok=gradeTyped(q,Q.typed);given=Q.typed||'(em branco)'}
    else{if(Q.pick==null)return;ok=Q.pick===q.ans;given=q.opts[Q.pick]}
    if(q.sym)mark(q.sym,ok);Q.res.push({q,ok,given});
  }
  Q.i++;Q.pick=null;Q.done=false;Q.typed='';
  if(Q.i>=Q.qs.length)finishQuiz();else{vQuiz();window.scrollTo(0,0)}
};
ACTS.quitq=()=>{const b=Q&&Q.back;Q=null;go(b?b.name:'home',b||{})};
function finishQuiz(){

/* recorte do diagrama com a caixa vermelha */
async function drawCrop(canvas,did,m){
  const im=await loadDiag(did);if(!canvas.isConnected)return;
  const [x0,y0,x1,y1]=m.b,bw=x1-x0,bh=y1-y0;
  const mx=Math.max(110,bw*.5),my=Math.max(90,bh*.5);
  let rx=Math.max(0,x0-mx),ry=Math.max(0,y0-my),rx2=Math.min(im.width,x1+mx),ry2=Math.min(im.height,y1+my);
  const rw=rx2-rx,rh=ry2-ry;const sc=Math.min(2,760/rw);
  canvas.width=Math.round(rw*sc);canvas.height=Math.round(rh*sc);
  const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);
  c.drawImage(im,rx,ry,rw,rh,0,0,canvas.width,canvas.height);
  c.strokeStyle='#d4290f';c.lineWidth=Math.max(3,3*sc);c.strokeRect((x0-rx)*sc,(y0-ry)*sc,bw*sc,bh*sc);
}

/* ===================== Esquemas (visualizador) ===================== */
let VW=null;
function vDiag(){
  const did=view.did||'h1530', d=diagById[did];
  app.innerHTML=`<section class="card" style="display:grid;gap:12px" data-g="${d.kind}">
    <div><div class="kicker" style="color:var(--steel)">Esquemas reais do manual</div><h1>Ler esquemas</h1><p class="muted">Dê zoom, arraste e toque nos componentes para ver o nome e o que fazem. No desafio, você acha cada componente no desenho.</p></div>
    <div class="seg">${DIAGS.map(x=>`<button class="btn" aria-pressed="${x.id===did}" data-act="pickdiag" data-d="${x.id}">${esc(x.title.replace(/^Esquema /,''))}</button>`).join('')}</div>
    <div class="tools"><button class="btn" data-act="zin" aria-label="Aproximar">＋</button><button class="btn" data-act="zout" aria-label="Afastar">−</button><button class="btn" data-act="zfit">Ajustar</button>
      <button class="btn" data-act="togglehs" aria-pressed="${view.hs!==false}">Mostrar componentes</button><button class="btn primary" data-act="challenge">Desafio: ache o componente</button></div>
    <div id="chal" hidden class="card" style="background:var(--ac-bg);border-color:var(--ac)"></div>
    <div class="viewer ${view.hs!==false?'show':''}" id="vw" aria-label="Esquema ${esc(d.title)}"></div>
    <div class="card" id="info" style="background:var(--surface2)"><span class="muted">Toque em um componente do desenho para ver os detalhes.</span></div>
  </section>`;
  VW=mountViewer($('#vw'),d);
}
ACTS.pickdiag=(b)=>{view.did=b.dataset.d;vDiag()};
ACTS.zin=()=>VW.zoom(1.35);ACTS.zout=()=>VW.zoom(1/1.35);ACTS.zfit=()=>VW.fit();
ACTS.togglehs=(b)=>{view.hs=!(view.hs!==false);$('#vw').classList.toggle('show',view.hs);b.setAttribute('aria-pressed',view.hs)};
function showInfo(m,d){
  const s=m.sym?bySym[m.sym]:null;
  $('#info').innerHTML=`<div class="row" style="align-items:flex-start;flex-wrap:nowrap">${s?`<div class="symimg" style="flex:0 0 120px;min-height:80px"><img alt="" src="${s.img}"></div>`:''}<div style="min-width:0"><h3>${esc(m.n)}</h3><p style="margin-top:4px">${esc(m.d)}</p>${s?`<p class="small muted" style="margin-top:6px">Símbolo da legenda: ${esc(s.name)}</p>`:''}</div></div>`;
}
function mountViewer(el,d){
  const W=d.w,H=d.h;let sc=1,tx=0,ty=0,minS=.1,maxS=4;
  const inner=document.createElement('div');inner.style.cssText=`position:absolute;left:0;top:0;width:${W}px;height:${H}px;transform-origin:0 0`;
  const img=new Image();img.src=DIAG[d.id];img.draggable=false;img.alt='';img.style.cssText='width:100%;height:100%;display:block;pointer-events:none;user-select:none';
  inner.appendChild(img);
  const hsEls=d.m.map((m,i)=>{const b=document.createElement('div');b.className='hs';b.style.cssText=`left:${m.b[0]}px;top:${m.b[1]}px;width:${m.b[2]-m.b[0]}px;height:${m.b[3]-m.b[1]}px;pointer-events:none`;inner.appendChild(b);return b});
  el.appendChild(inner);
  function apply(){inner.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;inner.style.setProperty('--inv',(1/sc).toFixed(3))}
  function fit(){const r=el.getBoundingClientRect();sc=Math.min(r.width/W,r.height/H);minS=sc*.8;tx=(r.width-W*sc)/2;ty=(r.height-H*sc)/2;apply()}
  function zoomAt(f,cx,cy){const ns=Math.min(Math.max(sc*f,minS),maxS);tx=cx-(cx-tx)*ns/sc;ty=cy-(cy-ty)*ns/sc;sc=ns;apply()}
  const api={fit,zoom:f=>{const r=el.getBoundingClientRect();zoomAt(f,r.width/2,r.height/2)},els:hsEls,d,onTap:null,flash(i,c){hsEls[i].classList.add(c)},clear(){hsEls.forEach(h=>h.classList.remove('sel','good','wrong'))}};
  requestAnimationFrame(fit);
  const ptrs=new Map();let moved=0,startD=0,startSc=1,downAt=null;
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downAt={x:e.clientX,y:e.clientY};if(ptrs.size===2){const [a,b]=[...ptrs.values()];startD=Math.hypot(a.x-b.x,a.y-b.y);startSc=sc}});
  el.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
    if(ptrs.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);tx+=dx;ty+=dy;apply()}
    else if(ptrs.size===2){const o=[...ptrs.entries()].find(([k])=>k!==e.pointerId)[1];const nd=Math.hypot(e.clientX-o.x,e.clientY-o.y);const r=el.getBoundingClientRect();const cx=(e.clientX+o.x)/2-r.left,cy=(e.clientY+o.y)/2-r.top;if(startD>0)zoomAt((startSc*nd/startD)/sc,cx,cy);moved+=10}
    p.x=e.clientX;p.y=e.clientY});
  const up=e=>{const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(had&&ptrs.size===0&&moved<8&&downAt){const r=el.getBoundingClientRect();const ix=(e.clientX-r.left-tx)/sc,iy=(e.clientY-r.top-ty)/sc;let best=-1,ba=1e18;d.m.forEach((m,i)=>{if(ix>=m.b[0]&&ix<=m.b[2]&&iy>=m.b[1]&&iy<=m.b[3]){const a=(m.b[2]-m.b[0])*(m.b[3]-m.b[1]);if(a<ba){ba=a;best=i}}});if(api.onTap)api.onTap(best,d.m[best])}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId)});
  el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  const onR=()=>{if(el.isConnected)fit();else window.removeEventListener('resize',onR)};window.addEventListener('resize',onR);
  api.onTap=(i,m)=>{if(CH)return chalTap(i,m);api.clear();if(i>=0){api.flash(i,'sel');showInfo(m,d)}};
  return api;
}
/* desafio */
let CH=null;
ACTS.challenge=()=>{
  const d=VW.d;const pool=shuffle(d.m).slice(0,Math.min(8,d.m.length));
  CH={list:pool,i:0,ok:0,bad:0,tries:0};$('#vw').classList.remove('show');VW.clear();chalRender();
};
function chalRender(){
  const box=$('#chal');box.hidden=false;
  if(CH.i>=CH.list.length){const pct=Math.round(100*CH.ok/CH.list.length);box.innerHTML=`<div class="row" style="justify-content:space-between"><div><h3>Desafio concluído</h3><p>${CH.ok} de ${CH.list.length} de primeira (${pct}%).</p></div><button class="btn primary" data-act="chalend">Fechar</button></div>`;return}
  const m=CH.list[CH.i];
  box.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="kicker">Componente ${CH.i+1} de ${CH.list.length}</div><h3>Toque em: ${esc(m.n)}</h3></div><button class="btn ghost" data-act="chalend">Encerrar</button></div>`;
}
ACTS.chalend=()=>{CH=null;$('#chal').hidden=true;VW.clear();$('#vw').classList.toggle('show',view.hs!==false)};
function chalTap(i,m){
  if(CH.i>=CH.list.length)return;
  const target=CH.list[CH.i];const ti=VW.d.m.indexOf(target);
  VW.clear();
  if(m&&m===target){VW.flash(ti,'good');if(CH.tries===0)CH.ok++;CH.i++;CH.tries=0;setTimeout(()=>{VW.clear();chalRender()},700)}
  else{if(i>=0)VW.flash(i,'wrong');CH.tries++;if(CH.tries>=2){VW.flash(ti,'good');CH.i++;CH.tries=0;$('#chal').insertAdjacentHTML('beforeend','<p class="small" style="margin-top:6px">Era este, marcado em verde.</p>');setTimeout(()=>{VW.clear();chalRender()},1500)}}
}

/* ===================== Prova ===================== */
function vExam(){
  const cards=[['e','Prova elétrica','20 perguntas: símbolos, trechos do esquema do GS-1530, ligações entre fios e códigos.'],['h','Prova hidráulica','20 perguntas: símbolos, trechos dos esquemas hidráulicos, posições e vias das válvulas, tabela de letras.'],['all','Prova geral','20 perguntas misturando elétrica e hidráulica.']];
  app.innerHTML=`<section class="card"><div class="kicker" style="color:var(--steel)">Avaliação</div><h1>Prova</h1><p class="muted" style="margin-top:6px">Sem dica e sem resposta na hora: a correção vem no final, com a explicação de cada pergunta. Para passar, ${EXAM_MIN}% ou mais. A prova é liberada quando você domina ${GATE}% dos símbolos do grupo.</p></section>
  <div class="grid2">${cards.map(([g,t,d])=>{
    const p=g==='all'?Math.min(domPct('e'),domPct('h')):domPct(g);const open=p>=GATE;
    const last=S.exams.filter(x=>x.g===g).slice(-1)[0];
    return `<section class="card ${open?'':'locked'}" ${g!=='all'?`data-g="${g}"`:''} style="display:grid;gap:10px"><h2 style="color:${g==='all'?'var(--steel)':'var(--ac)'}">${t}</h2><p class="muted small">${d}</p>
    ${barHtml(Math.min(100,Math.round(100*p/GATE)))}<p class="small">${open?'Liberada.':`Falta dominar mais símbolos (${p}% de ${GATE}%).`}${last?` Última nota: <b>${Math.round(100*last.score/last.total)}%</b>.`:''}</p>
    <div class="row"><button class="btn ${open?'primary':''}" data-act="startexam" data-x="${g}">${open?'Começar':'Fazer mesmo assim'}</button></div></section>`}).join('')}</div>`;
}
ACTS.startexam=(b)=>{const g=b.dataset.x;const qs=buildExam(g);Q={i:0,res:[],pick:null,done:false,typed:'',g,exg:g,title:'Prova '+(g==='all'?'geral':GN[g].toLowerCase()),qs,mode:'exam',back:{name:'exam'}};go('quiz',{g:g==='all'?'':g,live:true})};

function vRef(){
  const f=view.f||'', gsel=view.gsel||'';
  const list=SYM.filter(s=>(!gsel||s.g===gsel)&&(!f||norm(s.name+' '+s.what).includes(norm(f))));
  app.innerHTML=`<section class="card" style="display:grid;gap:12px"><div><div class="kicker" style="color:var(--steel)">Legendas das páginas 205 e 206</div><h1>Consulta</h1></div>
    <div class="row"><input class="txt" id="rf" type="search" placeholder="Buscar símbolo (ex.: válvula, motor, fusível)" value="${esc(f)}" style="flex:1 1 240px;width:auto">
    <div class="seg"><button class="btn" aria-pressed="${gsel===''}" data-act="rg" data-v="">Todos</button><button class="btn" aria-pressed="${gsel==='e'}" data-act="rg" data-v="e">Elétrica</button><button class="btn" aria-pressed="${gsel==='h'}" data-act="rg" data-v="h">Hidráulica</button></div></div>
    <div class="glos">${list.map(s=>`<button data-act="detail" data-id="${s.id}"><span class="dom m${Math.min(2,boxOf(s.id))}" title="${dominated(s)?'dominado':'em estudo'}"></span><div class="symimg"><img alt="" src="${s.img}"></div><span class="nm">${esc(s.name)}</span></button>`).join('')||'<p class="muted">Nada encontrado.</p>'}</div>
    <p class="small muted">Ponto verde: símbolo dominado.</p></section>`;
  const inp=$('#rf');inp.addEventListener('input',()=>{view.f=inp.value;const pos=inp.selectionStart;vRef();const n=$('#rf');n.focus();n.setSelectionRange(pos,pos)});
}
ACTS.rg=(b)=>{view.gsel=b.dataset.v;vRef()};
function openModal(s){
  $('#modalRoot').innerHTML=`<div class="modal" data-act="mclose" role="dialog" aria-modal="true"><div class="card study" data-g="${s.g}">${symCardHtml(s)}<div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="mclose">Fechar</button></div></div></div>`;
}
function closeModal(){const m=$('#modalRoot');if(m)m.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
ACTS.mclose=(b,e)=>{if(b.classList.contains('modal')&&e.target!==b)return;closeModal()};

render();
</script>
