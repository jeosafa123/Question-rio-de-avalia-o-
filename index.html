<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Esquemas GS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com abas; conteúdo em coluna única de até 980px; cada grupo tem cor própria (elétrica = âmbar, hidráulica = azul). */
:root{
  --bg:#e9edef; --surface:#ffffff; --surface2:#f3f6f7; --fg:#192227; --muted:#566570; --line:#cfd8dd;
  --steel:#33505f; --steel-fg:#ffffff; --steel-bg:#dde8ee;
  --elec:#a45f00; --elec-fg:#ffffff; --elec-bg:#fdecc8;
  --hyd:#0a6a97; --hyd-fg:#ffffff; --hyd-bg:#d6edf8;
  --ok:#17703f; --ok-bg:#d9f1e3; --bad:#b3261e; --bad-bg:#fbe0dd;
  --imgbg:#ffffff; --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
  --ac:var(--steel); --ac-fg:var(--steel-fg); --ac-bg:var(--steel-bg);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171b; --surface:#1b2227; --surface2:#222b31; --fg:#e7edf0; --muted:#9aa9b3; --line:#334048;
  --steel:#8fb5ca; --steel-fg:#0f1a20; --steel-bg:#1f3039;
  --elec:#f2b134; --elec-fg:#201500; --elec-bg:#3b2d10;
  --hyd:#5fc1ee; --hyd-fg:#06202c; --hyd-bg:#0f2f3e;
  --ok:#62d391; --ok-bg:#14301f; --bad:#ff8f86; --bad-bg:#3b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --surface:#1b2227; --surface2:#222b31; --fg:#e7edf0; --muted:#9aa9b3; --line:#334048;
  --steel:#8fb5ca; --steel-fg:#0f1a20; --steel-bg:#1f3039;
  --elec:#f2b134; --elec-fg:#201500; --elec-bg:#3b2d10;
  --hyd:#5fc1ee; --hyd-fg:#06202c; --hyd-bg:#0f2f3e;
  --ok:#62d391; --ok-bg:#14301f; --bad:#ff8f86; --bad-bg:#3b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
  const cards=[['e','Prova elétrica','20 perguntas: símbolos, trechos do esquema do GS-1530, ligações entre fios e códigos.'],['h','Prova hidráulica','20 perguntas: símbolos, trechos dos esquemas hidráulicos, posições e vias das válvulas, tabela de letras.'],['all','Prova geral','20 perguntas misturando elétrica e hidráulica.']];
  app.innerHTML=`<section class="card"><div class="kicker" style="color:var(--steel)">Avaliação</div><h1>Prova</h1><p class="muted" style="margin-top:6px">Sem dica e sem resposta na hora: a correção vem no final, com a explicação de cada pergunta. Para passar, ${EXAM_MIN}% ou mais. A prova é liberada quando você domina ${GATE}% dos símbolos do grupo.</p></section>
  <div class="grid2">${cards.map(([g,t,d])=>{
    const p=g==='all'?Math.min(domPct('e'),domPct('h')):domPct(g);const open=p>=GATE;
    const last=S.exams.filter(x=>x.g===g).slice(-1)[0];
    return `<section class="card ${open?'':'locked'}" ${g!=='all'?`data-g="${g}"`:''} style="display:grid;gap:10px"><h2 style="color:${g==='all'?'var(--steel)':'var(--ac)'}">${t}</h2><p class="muted small">${d}</p>
    ${barHtml(Math.min(100,Math.round(100*p/GATE)))}<p class="small">${open?'Liberada.':`Falta dominar mais símbolos (${p}% de ${GATE}%).`}${last?` Última nota: <b>${Math.round(100*last.score/last.total)}%</b>.`:''}</p>
    <div class="row"><button class="btn ${open?'primary':''}" data-act="startexam" data-x="${g}">${open?'Começar':'Fazer mesmo assim'}</button></div></section>`}).join('')}</div>`;
}
ACTS.startexam=(b)=>{const g=b.dataset.x;const qs=buildExam(g);Q={i:0,res:[],pick:null,done:false,typed:'',g,exg:g,title:'Prova '+(g==='all'?'geral':GN[g].toLowerCase()),qs,mode:'exam',back:{name:'exam'}};go('quiz',{g:g==='all'?'':g,live:true})};

/* ===================== Consulta ===================== */
function vRef(){
  const f=view.f||'', gsel=view.gsel||'';
  const list=SYM.filter(s=>(!gsel||s.g===gsel)&&(!f||norm(s.name+' '+s.what).includes(norm(f))));
  app.innerHTML=`<section class="card" style="display:grid;gap:12px"><div><div class="kicker" style="color:var(--steel)">Legendas das páginas 205 e 206</div><h1>Consulta</h1></div>
    <div class="row"><input class="txt" id="rf" type="search" placeholder="Buscar símbolo (ex.: válvula, motor, fusível)" value="${esc(f)}" style="flex:1 1 240px;width:auto">
    <div class="seg"><button class="btn" aria-pressed="${gsel===''}" data-act="rg" data-v="">Todos</button><button class="btn" aria-pressed="${gsel==='e'}" data-act="rg" data-v="e">Elétrica</button><button class="btn" aria-pressed="${gsel==='h'}" data-act="rg" data-v="h">Hidráulica</button></div></div>
    <div class="glos">${list.map(s=>`<button data-act="detail" data-id="${s.id}"><span class="dom m${Math.min(2,boxOf(s.id))}" title="${dominated(s)?'dominado':'em estudo'}"></span><div class="symimg"><img alt="" src="${s.img}"></div><span class="nm">${esc(s.name)}</span></button>`).join('')||'<p class="muted">Nada encontrado.</p>'}</div>
    <p class="small muted">Ponto verde: símbolo dominado.</p></section>`;
  const inp=$('#rf');inp.addEventListener('input',()=>{view.f=inp.value;const pos=inp.selectionStart;vRef();const n=$('#rf');n.focus();n.setSelectionRange(pos,pos)});
}
ACTS.rg=(b)=>{view.gsel=b.dataset.v;vRef()};
function openModal(s){
  $('#modalRoot').innerHTML=`<div class="modal" data-act="mclose" role="dialog" aria-modal="true"><div class="card study" data-g="${s.g}">${symCardHtml(s)}<div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="mclose">Fechar</button></div></div></div>`;
}
function closeModal(){const m=$('#modalRoot');if(m)m.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
ACTS.mclose=(b,e)=>{if(b.classList.contains('modal')&&e.target!==b)return;closeModal()};

render();
</script>

</body></html>
